name: Regression Tests

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-regression:
    name: Python and Chromium regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Check Python syntax
        run: |
          python -m py_compile tests/regression.py
          python -m py_compile tests/exploit_regression.py

      - name: Run full regression suite
        run: python tests/regression.py

      - name: Run focused exploit regression suite
        run: python tests/exploit_regression.py
